<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <!-- Main cyan-to-blue gradient (left bolt) -->
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <!-- Darker blue gradient (right bolt) -->
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="grad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#67e8f9"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===== ICON MARK ===== -->
  <g transform="translate(200, 170)" filter="url(#softglow)">

    <!-- Left lightning bolt (tilted left, cyan) -->
    <g transform="rotate(-18) translate(-55, -10)">
      <path d="M 10 -90
               L -18 -10
               L  0  -10
               L -22  90
               L  20   5
               L   2   5
               Z"
            fill="url(#grad1)" opacity="0.95"/>
    </g>

    <!-- Right lightning bolt (tilted right, blue) -->
    <g transform="rotate(18) translate(40, -10)">
      <path d="M 10 -90
               L -18 -10
               L  0  -10
               L -22  90
               L  20   5
               L   2   5
               Z"
            fill="url(#grad2)" opacity="0.90"/>
    </g>

    <!-- Center overlap blend area (slightly lighter) -->
    <g transform="translate(-8, -5)">
      <path d="M 14 -60
               L  0   0
               L  10  0
               L -4  55
               L  18  5
               L   8  5
               Z"
            fill="#60c8f5" opacity="0.35"/>
    </g>

    <!-- Growth arrow (top-right, cyan bright) -->
    <g transform="translate(28, -60) rotate(-5)" filter="url(#glow)">
      <!-- Arrow shaft -->
      <rect x="-4" y="0" width="8" height="62" rx="4" fill="url(#grad3)"/>
      <!-- Arrow head -->
      <polygon points="0,-18 -14,12 14,12" fill="url(#grad3)"/>
    </g>

  </g>

  <!-- ===== TS BADGE ===== -->
  <g transform="translate(268, 252)">
    <rect x="0" y="0" width="44" height="28" rx="5" fill="#1e3a8a"/>
    <text x="22" y="20" font-family="'SF Pro Display','Segoe UI',Arial,sans-serif"
          font-size="16" font-weight="900" fill="white" text-anchor="middle"
          letter-spacing="0.5">TS</text>
  </g>

  <!-- ===== LOGOTYPE ===== -->
  <text x="200" y="355"
        font-family="'SF Pro Display','Segoe UI',Arial,sans-serif"
        font-size="40" font-weight="900" fill="#0f172a"
        text-anchor="middle" letter-spacing="-0.5">
    super-http
  </text>
  <text x="200" y="390"
        font-family="'SF Pro Display','Segoe UI',Arial,sans-serif"
        font-size="13" font-weight="500" fill="#64748b"
        text-anchor="middle" letter-spacing="3">
    A RESILIENT HTTP CLIENT
  </text>
</svg>
