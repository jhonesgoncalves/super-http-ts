name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (e.g. v2.1.2)
        required: true
        type: string
  push:
    tags: ['v[0-9]*']
  release:
    types: [created]

# Serialize tag/release events for the same version; publication is idempotent.
concurrency:
  group: npm-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration

  publish:
    name: Publish to npm
    permissions:
      contents: read
      id-token: write
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@11
      - run: npm ci
      - run: npm run build
      - name: Validate release tag and check registry
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$VERSION"
          if npm view "super-http@$VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null | grep -qx "$VERSION"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify OIDC publishing environment
        if: steps.package.outputs.published != 'true'
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          node --version
          npm --version
      - name: Publish with npm trusted publishing
        if: steps.package.outputs.published != 'true'
        run: npm publish --access public
