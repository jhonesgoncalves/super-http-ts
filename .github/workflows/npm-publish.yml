name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (e.g. v2.1.1)
        required: true
        type: string
  push:
    tags: ['v[0-9]*']
  release:
    types: [created]

# Serialize tag/release events for the same version; publication is idempotent.
concurrency:
  group: npm-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate release tag and check registry
        id: package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$RELEASE_TAG" = "v$VERSION"
          if npm view "super-http@$VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null | grep -qx "$VERSION"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify npm credential
        if: steps.package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::Configure the repository Actions secret NPM_TOKEN with npm publish permission.'
            exit 1
          fi
      - run: npm publish
        if: steps.package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
